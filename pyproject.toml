[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-gaming-script-generator"
version = "0.1.0"
description = "Gera roteiros para vídeos de games e três thumbnails com CrewAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.102.0",
    "crewai-tools>=0.38.0",
    "pydantic>=2.4.2,<3.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
gaming-script = "gaming_script_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
